<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Nearby Vibes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: #faf8f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #0a0a0a;
    }

    .container {
      text-align: center;
      max-width: 300px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      font-weight: 800;
    }

    p {
      font-size: 15px;
      color: rgba(10, 10, 10, 0.65);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      Check your internet connection and try again. You can still view previously loaded content.
    </p>
  </div>
</body>
</html>
