name: CI - Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nearby_vibes_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint backend
        run: pnpm --filter @nearby-vibes/backend run lint

      - name: Lint frontend
        run: pnpm --filter @nearby-vibes/web run lint

      - name: Type check backend
        run: pnpm --filter @nearby-vibes/backend run type-check

      - name: Type check frontend
        run: pnpm --filter @nearby-vibes/web run type-check

      - name: Build backend
        run: pnpm --filter @nearby-vibes/backend run build

      - name: Build frontend
        run: pnpm --filter @nearby-vibes/web run build

      - name: Run backend tests
        run: pnpm --filter @nearby-vibes/backend run test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nearby_vibes_test
          JWT_SECRET: test-secret-key
          NODE_ENV: test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
